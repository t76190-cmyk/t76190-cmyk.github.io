var SELF_BODY="①号外シリーズ全4弾の完成（配布物）\n号外は第3弾・第4弾が完成し、全4弾が揃いました（第1・2弾は先日お送りしたものです）。添付の目的資料に、配布の考え方と使い方をまとめています。\n\n②グループページ群の公開\nグループ各社のページを公開しました。商談の場でそのまま見せられる会社案内です。\nhttps://t76190-cmyk.github.io/sew2026/nihon-ecosolar.html\n\n③当日ツールの進捗共有（制作途中）\n展示会当日に使う社内ツールを、役割別に3つの版で作っています。いずれも制作途中の確認用として共有します。公開ページとは別の場所にあり、リンクを知っている方だけが開けます。\nティリーニさん用：https://t76190-cmyk.github.io/memo-t4k7x9/\n社長用：https://t76190-cmyk.github.io/memo-m9k2x4/\nこのほかに、制作用の版があります。\n\n④ドメイン nihoneco.solar の取得提案\nイベント後の展開も見据えて、グループページの受け皿になるドメインの提案を添付します。取得の手順まで含めたカタログ形式にしています。\n\n⑤FIT公開データの集計共有\n資源エネルギー庁の公開データ（「事業計画認定情報」2026年10月31日版）を集計したダッシュボードは、Googleドライブでティリーニさんに閲覧共有済みです（11月14日）。展示会での話題づくりにも使えるかと思います。\n\n⑥バナーの共有（当日は使用しません）\n別添のバナーは共有用に添付したものです。歌詞を含むため、イベント当日の利用については権利関係（JASRAC等）の申請が間に合いません。当日は使用しない前提での共有としてご覧ください。\n\n⑦資源エネルギー庁への相談書面・稟議書の持参予告\nFIT未稼働案件のデータ活用について、資源エネルギー庁への相談書面と社内稟議書の下書きを用意しています。添付はしませんが、展示会に印刷して持参しますので、対面でご相談させてください。\n\n⑧公式キャラクター「ヌル」デザインシートの共有（事後報告）\n社長との面談時にご許可をいただいた件です。事後報告として、ひかりマッチの公式キャラクター「ヌル」のデザインをまとめたシートを添付します。キャッチフレーズは「亀は万年、猫ねんね。」です。\n\n⑨A3パンフレット（見開き4ページ）の事後報告\n展示会で配布する見開き4ページのA3パンフレットは、社長との面談時にご許可をいただき、印刷入稿済みです。事後報告として記載します。\n\n⑩出展社さくいん（公開ページ）のご了解のお願い\n出展社210社の公開情報から作った検索ページ「出展社さくいん」を公開しています。\nhttps://t76190-cmyk.github.io/sew2026/\n掲載内容は各社の公開情報のみで、社内の情報は含みません。このページは2026年11月13日のメールで「個人の非公式ページ」としてご報告済みのものですが、あらためて本稟議書でご了解をいただきたく、追加でご報告します。不都合があれば即時非公開にします。会期後も出展社の名簿として活用できます。\n\n⑪稟議書の仕組みについて（テスト実装と運用）\nこの稟議書の仕組みは、今回テストも兼ねて、制作中のさくいんページに実装しました。現状は、セキュリティ面の課題も含め、運用は東一人で行っています。記録は各自のブラウザの中にのみ残ります。\n\n制作環境\nt76190@gmail.com（個人メール）\nAI環境　必須\nミューズ\nCopilot\nGemini\nt76190t76190@gmail.com（個人メール・新規登録）\n光マッチ用メール\n空メール用QRコード等\nこの環境で制作していきます。ご了解ください。";
var SELF_BODY_EN="①Completion of the four-part \"Gogai\" extra series (handouts)\nIssues 3 and 4 are complete, and all four issues are now ready (Issues 1 and 2 were sent earlier). The attached purpose document sets out how they are to be distributed and used.\n\n②Publication of the group company pages\nPages for each group company have been published — a company brochure that can be shown as-is during business talks.\nhttps://t76190-cmyk.github.io/sew2026/nihon-ecosolar.html\n\n③Progress sharing: event-day tools (in production)\nInternal tools for the exhibition days are being built in three role-based editions, shared here as works in progress for review. They are kept apart from the public pages and open only via their links.\nFor Thilini: https://t76190-cmyk.github.io/memo-t4k7x9/\nFor the President: https://t76190-cmyk.github.io/memo-m9k2x4/\nThere is also a production edition, which is not shared as a link.\n\n④Proposal: acquire the domain nihoneco.solar\nWith post-event development in mind, a proposal for a domain to host the group pages is attached, in catalogue format including the acquisition steps.\n\n⑤Sharing the FIT public-data dashboard\nThe dashboard compiled from the Agency for Natural Resources and Energy's public data (\"Business Plan Certification Information\", as of October 31, 2026) has been shared with Thilini on Google Drive (view access, November 14). It may also serve as a conversation piece at the exhibition.\n\n⑥Sharing the banner (not for use on the day)\nThe attached banner is shared for reference only. As it contains song lyrics, the rights clearance (JASRAC and others) cannot be completed in time for the event, so please regard it as not to be used on the day.\n\n⑦Notice: consultation documents for the Agency for Natural Resources and Energy\nDraft consultation documents and an internal ringi concerning the use of data on not-yet-operating FIT projects have been prepared. They are not attached; I will bring printed copies to the exhibition and would like to consult in person.\n\n⑧Sharing the official character \"NULL\" design sheet (post-facto report)\nThis item was approved at my meeting with the President. As a post-facto report, I attach the design sheet for HIKARI match's official character \"NULL\". Its catchphrase is \"Kame wa mannen, neko nenne.\" — turtles live ten thousand years; cats just nap.\n\n⑨Post-facto report: A3 pamphlet (4-page spread)\nThe 4-page A3 pamphlet for distribution at the exhibition was approved at my meeting with the President and has been sent to print. Recorded here as a post-facto report.\n\n⑩Request for acknowledgement: the exhibitor index (public page)\nI have published a searchable exhibitor index built from the public information of all 210 exhibitors.\nhttps://t76190-cmyk.github.io/sew2026/\nIt contains only public information and no internal data. I reported this page in my email of November 13, 2026 as a personal, unofficial page; I am now reporting it again through this ringi to ask for your formal acknowledgement. If it causes any inconvenience, I will take it down immediately. It can also serve as an exhibitor directory after the event.\n\n⑪About the ringi function (test implementation and operation)\nThis ringi function has been implemented — as a test this time — in the exhibitor-index pages now in production. At present, operation is handled by Azuma alone, including the outstanding security issues. Records remain only in each person's own browser.\n\nProduction environment\nt76190@gmail.com (personal email)\nAI tools — required\nMuse\nCopilot\nGemini\nt76190t76190@gmail.com (personal email, newly registered)\nEmail for Hikari Match\nQR code for the blank-email flow, etc.\nProduction will be carried out in this environment. Thank you for your understanding.\n";

function ymd(ts){var d=new Date(ts);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();}

function loadStore(){try{var s=JSON.parse(localStorage.getItem(SKEY)||'{}')||{};if(s['0']&&!s.__self){s.__self={docs:{d0:s['0']},cur:'d0'};delete s['0'];}return s;}catch(e){return{};}}
