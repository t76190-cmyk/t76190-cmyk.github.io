  document.getElementById('sum').innerHTML = '<b>実績</b>（野望' + tot + '社）見込みあり ' + oa + ' ・ 社長取り次ぎ ' + takes.length + ' ・ 時間指定 ' + timed + '社'
    + '<div class="stack"><i class="sg-t" style="width:' + pct(t) + '%"></i><i class="sg-v" style="width:' + pct(v) + '%"></i><i class="sg-l" style="width:' + pct(l) + '%"></i><i class="sg-k" style="width:' + pct(sk) + '%"></i><i class="sg-s" style="width:' + pct(s) + '%"></i><i class="sg-r" style="width:' + pct(rest) + '%"></i></div>'
    + '<div class="legend"><span><i class="lg-t"></i>話せた ' + t + '</span><span><i class="lg-v"></i>訪問済 ' + v + '</span><span><i class="lg-l"></i>あとで回る ' + l + '</span><span><i class="lg-k"></i>今日はまわらない ' + sk + '</span><span><i class="lg-s"></i>行かない ' + s + '</span><span><i class="lg-r"></i>まだ ' + rest + '</span></div>'
    + '<span style="font-size:12px;color:#777">' + gs + '</span>'
    + (takes.length ? '<div class="takes"><b>社長取り次ぎ一覧：</b>' + takes.map(function(r){ return '<a href="index.html#co=' + r.ci + '" style="color:#7a1f1f;font-weight:700;text-decoration:none">' + esc(r.name) + '</a>'; }).join('、') + '</div>' : '');
}
document.getElementById('resetBtn').addEventListener('click', function(){ if (confirm('優先・日・時刻・取り次ぎ等の設定を全部消しますか？（訪問記録は消えません）')) { settings = {__flow: []}; saveSettings(); renderNext(); renderSum(); } });
renderNext(); renderSum();
</script></body></html>
