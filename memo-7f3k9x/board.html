}

if (k === "cardfile"){
const f = el.files && el.files[0]; if (!f) return;
const rd = new FileReader();
rd.onload = () => {
const img = new Image();
img.onload = () => {
const max = 1024, sc = Math.min(1, max / Math.max(img.width, img.height));
const cv = document.createElement("canvas");
cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
setField(i, "card", cv.toDataURL("image/jpeg", 0.8));
render(); if (curDetail === i) openDetail(i);
};
img.src = rd.result;
};
rd.readAsDataURL(f);
return;
}

else if (k === "my") setField(i, "my", el.value);
else if (k === "boss"){

});

});
if (conn.length){ lines.push("■繋がった"); lines.push.apply(lines, conn);}
if (acted.length){ lines.push("■訪問・ステータスあり"); lines.push.apply(lines, acted);}
if (fuyu.length){ lines.push("■不要"); lines.push.apply(lines, fuyu);}
const text = lines.join("\n");
const msg = document.getElementById("copyMsg");
try {
await navigator.clipboard.writeText(text);
msg.textContent = "コピーしました";
} catch (e) {
const ta = document.createElement("textarea");
ta.value = text; document.body.appendChild(ta); ta.select();
try { document.execCommand("copy"); msg.textContent = "コピーしました";}
catch (e2) { msg.textContent = "コピーできませんでした";}
ta.remove();
}
setTimeout(() => { msg.textContent = "";}, 3000);
});

render();
</script>
<script>
(function(){

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function tsNow(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function logEvent(text){
  try {
    var a = JSON.parse(localStorage.getItem('eventLogV1') || '[]');
    a.push({ t: tsNow(), text: text });
    localStorage.setItem('eventLogV1', JSON.stringify(a));
  } catch(e){}
}

  function coLabel(i){ try { var c = COMPANIES[i]; return c ? (c.n + '（' + c.b + '）') : '#' + i; } catch(e){ return '#' + i; } }
  if (typeof setField === 'function') {
    var orig = setField;
    setField = function(i, k, v){
      orig(i, k, v);
      try {
        if (k === 'card') logEvent('管制盤 ' + coLabel(i) + ' 名刺画像を登録');
        else if (k === 'my') logEvent('管制盤 ' + coLabel(i) + ' 自分 = ' + v);
        else if (k === 'boss') logEvent('管制盤 ' + coLabel(i) + ' 社長 = ' + (v || '（消去）'));
        else if (k === 'fuyu') logEvent('管制盤 ' + coLabel(i) + ' 付随 = ' + (v ? 'あり' : 'なし'));
        else logEvent('管制盤 ' + coLabel(i) + ' ' + k + ' = ' + v);
      } catch(e){}
    };
  }
})();
</script>
