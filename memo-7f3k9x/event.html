function visitKey(){
  var p = location.pathname.replace(/[^\/]*$/, 'index.html');
  return 'visitState:' + p;
}
function axisColor(axis, v){
  if (v === 5) return '#f3d27a';
  if (axis === 'fund') return v < 5 ? '#dcebfc' : '#9dbfe8';
  return v < 5 ? '#f6c9c9' : '#bfe3c0';
}

  if (v === 5) return '基準';

  return v < 5 ? '売り' : '買い';
}

    if (v.s === 'v') cnt.vis++;

      var val = r.st[ax[0]];
      if (val) {
        h += '<div class="ax on" style="background:' + axisColor(ax[0], +val) + '">' + ax[1] + '<span class="v">' + val + ' ' + axisWord(ax[0], +val) + '</span></div>';
